# Local development only. Database and app ports bind to loopback.
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?Set MONGO_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    volumes:
      - ifca_mongo:/data/db
    ports:
      - "127.0.0.1:27017:27017"
  ml:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    restart: unless-stopped
  app:
    build: .
    environment:
      NODE_ENV: development
      SERVE_CLIENT: "true"
      API_PORT: "3001"
      CLIENT_ORIGIN: http://localhost:3001
      ML_SERVICE_URL: http://ml:8001
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/ifca?authSource=admin
    depends_on:
      - mongo
      - ml
    ports:
      - "127.0.0.1:3001:3001"
    restart: on-failure
volumes:
  ifca_mongo:
